name: Newman API Tests

on:
  push:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman and HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman collection
        run: newman run "Simple Grocery Store API.postman_collection.json" -e "Grocery API - Local.postman_environment.json" --env-var "baseUrl=https://simple-grocery-store-api.click" --delay-request 500 -r cli,htmlextra --reporter-htmlextra-export report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: report.html
